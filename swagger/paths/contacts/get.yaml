tags:
  - Contacts

summary: Get list of contacts
operationId: getContacts
description: Get a list of contacts

security:
  - bearerAuth: []

parameters:
  - in: query
    name: page
    description: Page number
    schema:
      type: integer
      example: 1

  - in: query
    name: perPage
    description: Number of contacts per page
    schema:
      type: integer
      example: 10

  - in: query
    name: sortBy
    description: Field to sort contacts by
    schema:
      type: string
      example: name

  - in: query
    name: sortOrder
    description: Sort order
    schema:
      type: string
      enum:
        - asc
        - desc
      example: asc

responses:
  '200':
    description: Successfully retrieved contacts
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - contacts
                - paginationData
              properties:
                contacts:
                  type: array
                  items:
                    $ref: '../../components/schemas/contact.yaml'

                paginationData:
                  type: object
                  required:
                    - page
                    - perPage
                    - totalItems
                    - totalPages
                    - hasPreviousPage
                    - hasNextPage
                  properties:
                    page:
                      type: integer
                      example: 1

                    perPage:
                      type: integer
                      example: 10

                    totalItems:
                      type: integer
                      example: 0

                    totalPages:
                      type: integer
                      example: 1

                    hasPreviousPage:
                      type: boolean
                      example: false

                    hasNextPage:
                      type: boolean
                      example: false

  '401':
    $ref: '../../components/responses/401.yaml'
