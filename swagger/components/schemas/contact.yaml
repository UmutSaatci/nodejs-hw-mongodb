type: object

required:
  - _id
  - name
  - phoneNumber
  - contactType
  - userId
  - isFavourite
  - createdAt
  - updatedAt

properties:
  _id:
    description: "Contact's ID"
    type: string
    example: '65ca67e7ae7f10c88b598384'

  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'

  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: '+380665438912'

  email:
    description: "Contact's email"
    type: string
    format: email
    example: 'john.doe@example.com'

  contactType:
    description: 'Type of the contact'
    type: string
    enum:
      - work
      - home
      - personal
    example: personal

  userId:
    description: 'ID of the user who owns the contact'
    type: string
    example: '65e4decdd286b30065d54af9'

  isFavourite:
    description: 'Whether the contact is marked as favourite'
    type: boolean
    example: false

  photo:
    description: "Link to contact's photo"
    type: string
    format: uri
    example: 'https://res.cloudinary.com/uqwgdu/image/upload/image.png'

  createdAt:
    description: 'Contact creation date'
    type: string
    format: date-time
    example: '2026-09-21T18:30:00.000Z'

  updatedAt:
    description: 'Contact last update date'
    type: string
    format: date-time
    example: '2026-09-21T18:30:00.000Z'
